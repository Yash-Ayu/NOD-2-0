{% extends "base.html" %}
{% block title %}Login - NOD{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M8 12c0 0 4-6 8-6s8 6 8 6"/>
        <path d="M8 12c0 0 4 8 8 8s8-8 8-8" opacity=".35"/>
      </svg>
      <span>NOD</span>
    </div>
    <h2>Welcome back</h2>
    <p class="auth-subtitle">Sign in to your AI assistant</p>
    
    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required minlength="6">
      </div>
      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMe">
          <span>Remember me</span>
        </label>
      </div>
      <button type="submit" class="auth-btn primary">Sign In</button>
    </form>
    
    <div class="auth-footer">
      Don't have an account? <a href="/signup">Sign up</a>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  
  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: document.getElementById('loginEmail').value,
      password: document.getElementById('loginPassword').value,
      remember: document.getElementById('rememberMe').checked
    })
  });
  
  const data = await res.json();
  btn.disabled = false;
  btn.textContent = 'Sign In';
  
  if (data.success) {
    window.location.href = '/chat';
  } else {
    alert(data.error || 'Login failed');
  }
});
</script>
{% endblock %}
