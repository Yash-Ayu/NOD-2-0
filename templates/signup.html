{% extends "base.html" %}
{% block title %}Sign Up - NOD{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M8 12c0 0 4-6 8-6s8 6 8 6"/>
        <path d="M8 12c0 0 4 8 8 8s8-8 8-8" opacity=".35"/>
      </svg>
      <span>NOD</span>
    </div>
    <h2>Create account</h2>
    <p class="auth-subtitle">Start your AI journey today</p>
    
    <form id="signupForm" class="auth-form">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="signupName" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="••••••••" required minlength="6">
        <small>Minimum 6 characters</small>
      </div>
      <button type="submit" class="auth-btn primary">Create Account</button>
    </form>
    
    <div class="auth-footer">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.textContent = 'Creating account...';
  
  const res = await fetch('/api/auth/signup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: document.getElementById('signupName').value,
      email: document.getElementById('signupEmail').value,
      password: document.getElementById('signupPassword').value
    })
  });
  
  const data = await res.json();
  btn.disabled = false;
  btn.textContent = 'Create Account';
  
  if (data.success) {
    window.location.href = '/chat';
  } else {
    alert(data.error || 'Signup failed');
  }
});
</script>
{% endblock %}
